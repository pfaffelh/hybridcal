# Site-level configuration — URLs and defaults
# Language-agnostic, not per-event.

url: https://hybridcal.de

# Base path for absolute links. Set to "/hybridcal" when deployed under
# https://pfaffelh.github.io/hybridcal/ (project page); set to "" when
# served from the root of a custom domain.
base_path: ""

# When set, build.py writes dist/CNAME which GitHub Pages reads to wire up
# the custom domain. Remove to fall back to pfaffelh.github.io/hybridcal.
custom_domain: hybridcal.de

# External resources
github_repo: https://github.com/pfaffelh/hybridcal

# Web3Forms relays the submission form's content via email.
# This key is public by design (like a Stripe publishable key) — protection
# is via domain whitelist set in the Web3Forms key settings.
web3forms_key: f5de45a5-191e-48ab-821e-6638c51ff377

# Defaults
default_language: de
# Pre-selected regions on first visit. Default: all European regions
# (DACH, British Isles, Western/Southern/Northern+Eastern Europe), so
# the page lands with a Europe focus. The "world" catchall is opt-in.
default_regions:
  - dach
  - british-isles
  - western-europe
  - southern-europe
  - northern-eastern-europe
