about:
  title: Über HybridCal
  intro: >
    HybridCal ist ein Community-Service: ein kostenloser, werbefreier Kalender für
    Hybrid-Sport-Events wie HYROX, ATHX, Deadly Dozen, DEKA und andere.
    Kein kommerzielles Angebot, keine Affiliate-Links, keine Tracker.
  listed_formats: Gelistete Formate
  how_added: Wie Events reinkommen
