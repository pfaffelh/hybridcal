submit:
  title: Event einreichen
  intro: >
    Du kennst ein Hybrid-Sport-Event, das hier noch fehlt? Schick uns die Infos —
    wir tragen es ein. Vielen Dank!
  form_heading: "Einfacher Weg: Formular"
  form_intro: >
    Über das Formular brauchst du keinen GitHub-Account. Wir sichten die
    Submission und tragen das Event ein (~24-48h).
  form_button: Event-Formular öffnen →
  form_note: "(Tally-Link hier einsetzen, sobald Formular angelegt.)"
  correction_heading: Fehler melden
  correction_intro: "Falsches Datum, falscher Ort, fehlende Kategorie? Per GitHub Issue:"
  correction_button: Korrektur melden →
  pr_heading: "Für Tech-Affine: Pull Request"
  pr_intro: >
    Direkt eine YAML-Datei im Repo anlegen.
    Bei Submission läuft automatische Validierung — du siehst sofort, ob deine
    Datei korrekt ist.
  pr_button: Zum Repository →

