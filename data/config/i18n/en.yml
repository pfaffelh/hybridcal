        the respective organizers.

privacy:
  title: Privacy Policy
  intro: >
    This website is a non-commercial community service. We set no
    cookies and run no tracking. This policy informs you about which
    data is inevitably processed when you visit the site.
  controller_heading: Controller
  controller_text: >
    The controller under GDPR is the person named in the imprint.
  sections:
    - heading: Server logs (hosting)
      body: >
        This site is hosted via GitHub Pages. On each request,
        technically necessary data is recorded in server logs: IP
        address, date and time, requested URL, browser type and
        version. This data is processed exclusively for the technical
        operation of the site and is not merged with other data
        sources. Legal basis: Art. 6 (1) (f) GDPR (legitimate interest
        in the technical provision).
        GitHub Privacy Statement: https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement
    - heading: Content Delivery Networks (CDN)
      body: >
        Frontend libraries (Pico.css, Alpine.js, Leaflet) are loaded
        via the public CDN jsdelivr.net. When loaded, your IP address
        is transmitted to jsdelivr. Legal basis: Art. 6 (1) (f) GDPR
        (website performance).
        jsdelivr Privacy: https://www.jsdelivr.com/terms/privacy-policy-jsdelivr-net
    - heading: Map display
      body: >
        On the map view, map tiles are loaded. Depending on the
        language version, they come from different providers: the
        German site uses OpenStreetMap Germany (FOSSGIS e.V.,
        tile.openstreetmap.de); the English site uses CARTO
        (basemaps.cartocdn.com). When loaded, your IP address is
        transmitted to the respective provider. Legal basis:
        Art. 6 (1) (f) GDPR (map functionality).
        OSM Germany: https://www.openstreetmap.de/datenschutz.html
        CARTO Privacy: https://carto.com/privacy
    - heading: Submission form
      body: >
        The /submit page offers a contact form. When you submit, the
        fields you have entered as well as technical data (IP address,
        timestamp) are transmitted to the service Web3Forms
        (api.web3forms.com), which forwards the data to us by email.
        According to Web3Forms' privacy policy, the contents are not
        stored permanently. Legal basis: Art. 6 (1) (a) GDPR (consent
        on submission). You may withdraw consent at any time.
        Web3Forms Privacy: https://web3forms.com/privacy
    - heading: Cookies
      body: >
        We set no cookies of our own. Any third-party cookies (e.g.
        by Web3Forms when submitting a form) are set only after your
        active interaction.
    - heading: Your rights
      body: >
        Under GDPR you have the following rights: access (Art. 15),
        rectification (Art. 16), erasure (Art. 17), restriction of
        processing (Art. 18), data portability (Art. 20), objection
        (Art. 21), and the right to lodge a complaint with a
        supervisory authority (Art. 77). Please direct requests to
        the contact email named in the imprint.
    - heading: Status and changes
      body: >
        We reserve the right to adapt this policy if technical
        prerequisites or legal requirements change.
