hyrox:
  name: HYROX
  type: Indoor Functional Race
  website: https://hyrox.com
  color: "#FFE600"  # HYROX brand yellow
  description_de: >
    Indoor-Wettkampf mit 8 Laufabschnitten à 1 km, abwechselnd mit
    8 funktionellen Stationen (Ski-Erg, Sled Push, Sled Pull, Burpee Broad Jumps,
    Rowing, Farmers Carry, Sandbag Lunges, Wall Balls).
  description_en: >
    Indoor race format with 8 x 1km runs alternating with 8 functional
    workout stations (Ski-Erg, Sled Push, Sled Pull, Burpee Broad Jumps,
    Rowing, Farmers Carry, Sandbag Lunges, Wall Balls).
  long_description_de: |
    ## Format

    [HYROX](https://en.wikipedia.org/wiki/Hyrox) ist ein standardisiertes Indoor-Race. 
    Der Ablauf ist weltweit
    identisch: **8 × 1 km Laufen**, jeweils gefolgt von einer **funktionellen
    Workout-Station**. Erst nach Beendigung einer Station darf der nächste
    Lauf-Loop begonnen werden.

    Die Gesamtdistanz beträgt 8 km Laufen plus die Stationen.

    ## Stationen & Gewichte (Saison 2025/26)

    | # | Station             | Distanz / Reps | Open (M / W)        | Pro (M / W)         |
    |---|---------------------|----------------|---------------------|---------------------|
    | 1 | SkiErg              | 1000 m         | —                   | —                   |
    | 2 | Sled Push           | 50 m (4×12,5)  | 152 kg / 102 kg     | 202 kg / 152 kg     |
    | 3 | Sled Pull           | 50 m (4×12,5)  | 103 kg / 78 kg      | 153 kg / 103 kg     |
    | 4 | Burpee Broad Jumps  | 80 m           | —                   | —                   |
    | 5 | Rowing              | 1000 m         | —                   | —                   |
    | 6 | Farmers Carry       | 200 m          | 2 × 24 kg / 2 × 16 kg | 2 × 32 kg / 2 × 24 kg |
    | 7 | Sandbag Lunges      | 100 m          | 20 kg / 10 kg       | 30 kg / 20 kg       |
    | 8 | Wall Balls          | 100 reps       | 6 kg / 4 kg         | 9 kg / 6 kg         |

    *Sled-Gewichte sind die Schlitten-Auflast (inkl. Schlittengewicht
    abhängig von der Veranstaltung). Die Wall-Ball-Zielhöhe beträgt
    3,05 m (M) / 2,75 m (W).*

    ## Kategorien

    - **Singles Open** — M / W (Altersgruppen 16–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, 60–64, 65–69, 70+)
    - **Singles Pro** — M / W (Altersgruppen 16–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, 60–64, 65–69)
    - **Doubles Open** — M / W / Mixed, jeweils gleiche Stationen (bei Mixed Gewichte der Singles Pro W). Beide Athlet:innen laufen, bei den Stationen darf man sich beliebig abwechseln.
    - **Doubles Pro** — M / W, jeweils gleiche Stationen
    - **Relay** — 4er-Staffel (M / W / Mixed), jeder läuft 2 km + 2 Stationen
    - **Corporate** — Firmen-Staffel über die Relay-Distanz
    - **Adaptive** — Para-Athletinnen/-Athleten (eigene Anpassungen)

    ## Neu in 2026 — Youngstars

    [HYROX Youngstars](https://hyrox.com/hyrox-youngstars/) ist das Race-Format
    für Kinder und Jugendliche von **8–15 Jahren**. Der Ablauf entspricht dem
    Adult-Race (8 Laufabschnitte + 8 Stationen), Distanzen und Gewichte sind
    aber an Alter und Entwicklungsstufe angepasst. Die Lauflänge pro Runde
    beträgt je nach Venue **200–275 m**.

    Es gibt vier Altersgruppen, jeweils getrennt nach Mädchen und Jungen
    (Divisionen A–H). Maßgeblich ist das Alter am Renntag.

    ### Stationen pro Altersgruppe (Saison 2025/26)

    | Station       | 8–9 J.            | 10–11 J.          | 12–13 J. M    | 12–13 J. J    | 14–15 J. M    | 14–15 J. J    |
    |---------------|-------------------|-------------------|---------------|---------------|---------------|---------------|
    | Lauf-Loop     | 1 Runde           | 1 Runde           | 2 Runden      | 2 Runden      | 1 Runde¹      | 1 Runde¹      |
    | SkiErg        | 300 m             | 400 m             | 500 m         | 500 m         | 600 m         | 600 m         |
    | Sled Push     | 15 m / 35 kg      | 15 m / 50 kg      | 30 m / 60 kg  | 30 m / 70 kg  | 30 m / 70 kg  | 30 m / 102 kg |
    | Sled Pull     | 15 m / 25 kg²     | 15 m / 40 kg²     | 30 m / 25 kg  | 30 m / 50 kg  | 30 m / 50 kg  | 30 m / 78 kg  |
    | Burpee Broad Jumps | 20 m (Frogger)  | 20 m              | 40 m          | 40 m          | 40 m          | 40 m          |
    | Rudern        | 200 m             | 300 m             | 400 m         | 400 m         | 500 m         | 500 m         |
    | Farmers Carry | 50 m / 2 × 4 kg   | 50 m / 2 × 6 kg   | 100 m / 8 kg  | 100 m / 12 kg | 100 m / 12 kg | 100 m / 16 kg |
    | Lunges        | 20 m              | 20 m              | 40 m / 5 kg   | 40 m / 7,5 kg | 40 m / 7,5 kg | 40 m / 10 kg  |
    | Wall Balls    | 50 Squats / 1 kg³ | 50 Squats / 2 kg³ | 50 / 2 kg 8 ft| 50 / 3 kg 8 ft| 50 / 3 kg 8 ft| 50 / 4 kg 9 ft|

    *M = Mädchen, J = Jungen. ¹ 14–15: 1 Runde zwischen jeder Station (wie
    Adult-Race). ² Stepback statt Pull mit Seil. ³ Bis 11 Jahre Squats ohne
    Wurf statt Wall Balls.*

    ### Ablauf

    - Eltern dürfen nicht mit auf den Race-Floor, übergeben das Kind in der
      Start-Zone und können vom Zuschauerbereich aus zusehen.
    - 25 Minuten betreutes Warm-up unter Anleitung von HYROX-Coaches direkt
      vor dem Start.
    - Pro Race nur eine Altersklasse + Geschlecht in einer Welle.
    - Penalties (z. B. +30 s falsche Arch, +90 s vergessener Lauf) statt
      Disqualifikation — die Kinder rennen immer zu Ende.


    ## Hinweis

    Verbindlich ist natürlich immer die offizielle Race-Information auf [hyrox.com](https://hyrox.com).
  long_description_en: |
    ## Format

    [HYROX](https://en.wikipedia.org/wiki/Hyrox) is a standardised indoor race.
    The structure is identical worldwide: **8 × 1 km runs**, each followed by
    a **functional workout station**. The next running loop can only begin
    after the current station is complete.

    Total distance is 8 km of running plus the stations.

    ## Stations & weights (2025/26 season)

    | # | Station             | Distance / Reps | Open (M / W)        | Pro (M / W)         |
    |---|---------------------|-----------------|---------------------|---------------------|
    | 1 | SkiErg              | 1000 m          | —                   | —                   |
    | 2 | Sled Push           | 50 m (4×12.5)   | 152 kg / 102 kg     | 202 kg / 152 kg     |
    | 3 | Sled Pull           | 50 m (4×12.5)   | 103 kg / 78 kg      | 153 kg / 103 kg     |
    | 4 | Burpee Broad Jumps  | 80 m            | —                   | —                   |
    | 5 | Rowing              | 1000 m          | —                   | —                   |
    | 6 | Farmers Carry       | 200 m           | 2 × 24 kg / 2 × 16 kg | 2 × 32 kg / 2 × 24 kg |
    | 7 | Sandbag Lunges      | 100 m           | 20 kg / 10 kg       | 30 kg / 20 kg       |
    | 8 | Wall Balls          | 100 reps        | 6 kg / 4 kg         | 9 kg / 6 kg         |

    *Sled weights are the total load on the sled (the sled's own weight may
    vary by venue). Wall-ball target height is 3.05 m (M) / 2.75 m (W).*

    ## Categories

    - **Singles Open** — M / W (age groups 16–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, 60–64, 65–69, 70+)
    - **Singles Pro** — M / W (age groups 16–24, 25–29, 30–34, 35–39, 40–44, 45–49, 50–54, 55–59, 60–64, 65–69)
    - **Doubles Open** — M / W / Mixed, same stations (Mixed uses Singles Pro W weights). Both athletes run together and may swap freely on the stations.
    - **Doubles Pro** — M / W, same stations
    - **Relay** — team of four (M / W / Mixed), each athlete runs 2 km + 2 stations
    - **Corporate** — company relay over the relay distance
    - **Adaptive** — para athletes (specific adaptations)

    ## New in 2026 — Youngstars

    [HYROX Youngstars](https://hyrox.com/hyrox-youngstars/) is the race format
    for children and teens aged **8–15**. The structure mirrors the adult
    race (8 runs + 8 stations), but distances and weights are adapted to age
    and stage of development. The run-loop length is **200–275 m** depending
    on the venue.

    There are four age groups, each split into girls and boys (divisions
    A–H). The decisive factor is the athlete's age on race day.

    ### Stations per age group (2025/26 season)

    | Station       | 8–9 yrs           | 10–11 yrs         | 12–13 G       | 12–13 B       | 14–15 G       | 14–15 B       |
    |---------------|-------------------|-------------------|---------------|---------------|---------------|---------------|
    | Run loop      | 1 lap             | 1 lap             | 2 laps        | 2 laps        | 1 lap¹        | 1 lap¹        |
    | SkiErg        | 300 m             | 400 m             | 500 m         | 500 m         | 600 m         | 600 m         |
    | Sled Push     | 15 m / 35 kg      | 15 m / 50 kg      | 30 m / 60 kg  | 30 m / 70 kg  | 30 m / 70 kg  | 30 m / 102 kg |
    | Sled Pull     | 15 m / 25 kg²     | 15 m / 40 kg²     | 30 m / 25 kg  | 30 m / 50 kg  | 30 m / 50 kg  | 30 m / 78 kg  |
    | Burpee Broad Jumps | 20 m (Frogger) | 20 m             | 40 m          | 40 m          | 40 m          | 40 m          |
    | Rowing        | 200 m             | 300 m             | 400 m         | 400 m         | 500 m         | 500 m         |
    | Farmers Carry | 50 m / 2 × 4 kg   | 50 m / 2 × 6 kg   | 100 m / 8 kg  | 100 m / 12 kg | 100 m / 12 kg | 100 m / 16 kg |
    | Lunges        | 20 m              | 20 m              | 40 m / 5 kg   | 40 m / 7.5 kg | 40 m / 7.5 kg | 40 m / 10 kg  |
    | Wall Balls    | 50 squats / 1 kg³ | 50 squats / 2 kg³ | 50 / 2 kg 8 ft| 50 / 3 kg 8 ft| 50 / 3 kg 8 ft| 50 / 4 kg 9 ft|

    *G = Girls, B = Boys. ¹ 14–15: one run lap between every station (as in
    the adult race). ² Sled drag with rope instead of pull. ³ Up to age 11,
    bodyweight squats replace wall balls (no throw).*

    ### How it works

    - Parents may not enter the race floor; they hand the child over in the
      start zone and watch from the spectator area.
    - 25-minute supervised warm-up led by HYROX coaches right before the
      start.
    - Each wave contains only one age group + gender.
    - Mistakes result in time penalties (e.g. +30 s wrong arch, +90 s missed
      lap) rather than disqualification — the kids always get to finish.

    ## Note

    The official race information at [hyrox.com](https://hyrox.com) is always
    authoritative.

deadly-dozen:
  name: Deadly Dozen
  type: Hybrid Race
  website: https://deadlydozen.com
  color: "#FF3131"  # Deadly Dozen brand red
  description_de: >
    Outdoor-Bahn-Race: 12 × 400 m Runden, jeweils gefolgt von einer der
    12 Stationen ("Labours") in fester Reihenfolge: Farmers Carry, Deadlift,
    Lunge, Snatch, Burpee Broad Jump, Goblet Squat, Front Carry, Push Press,
    Bear Crawl, Clean & Press, Overhead Carry, Devil Press.
  description_en: >
    Outdoor track race: 12 × 400 m laps, each followed by one of the
    12 stations ("Labours") in fixed order: Farmers Carry, Deadlift,
    Lunge, Snatch, Burpee Broad Jump, Goblet Squat, Front Carry, Push Press,
    Bear Crawl, Clean & Press, Overhead Carry, Devil Press.
  long_description_de: |
    ## Format

    **Deadly Dozen** ist ein Bahn-Race auf einer Standard-Leichtathletik-Bahn:
    **12 × 400 m Laufabschnitte ("Journeys")**, jeweils gefolgt von einer
    der 12 Stationen ("Labours"). Es gibt nur Bodyweight, Kettlebells,
    Dumbbells und Hantelscheiben — kein spezialisiertes Equipment.

    Die Reihenfolge ist fix; ein Lauf darf erst nach Abschluss der vorherigen
    Station begonnen werden. Mindestalter im Track Race ist 18 Jahre (Ausnahme:
    Youth-Format).

    ## Die 12 Labours (Track Race, Reihenfolge offiziell)

    Reihenfolge, Equipment, Volumen und Gewichte aus der offiziellen
    Race-Tabelle für das Deadly Dozen Track Race.

    | RND | Labour              | Equipment    | Reps / Distanz | Male        | Female      |
    |-----|---------------------|--------------|----------------|-------------|-------------|
    | 1   | Farmers Carry       | Kettlebell   | 240 m          | 2 × 24 kg   | 2 × 16 kg   |
    | 2   | Deadlift            | Kettlebell   | 60 Reps        | 1 × 32 kg   | 1 × 24 kg   |
    | 3   | Lunge               | Dumbbell     | 60 m           | 2 × 12,5 kg | 2 × 7,5 kg  |
    | 4   | Snatch              | Dumbbell     | 60 Reps        | 1 × 15 kg   | 1 × 9 kg    |
    | 5   | Burpee Broad Jump   | Bodyweight   | 60 m           | —           | —           |
    | 6   | Goblet Squat        | Kettlebell   | 60 Reps        | 1 × 16 kg   | 1 × 12 kg   |
    | 7   | Front Carry         | Weight Plate | 240 m          | 1 × 25 kg   | 1 × 20 kg   |
    | 8   | Push Press          | Dumbbell     | 60 Reps        | 2 × 12,5 kg | 2 × 6 kg    |
    | 9   | Bear Crawl          | Bodyweight   | 120 m          | —           | —           |
    | 10  | Clean & Press       | Weight Plate | 60 Reps        | 1 × 15 kg   | 1 × 10 kg   |
    | 11  | Overhead Carry      | Weight Plate | 180 m          | 1 × 15 kg   | 1 × 10 kg   |
    | 12  | Devil Press         | Dumbbell     | 20 Reps        | 2 × 10 kg   | 2 × 5 kg    |

    Jeder Labour-Block folgt direkt auf eine 400-m-Bahnrunde (Journey). Volumen
    und Gewichte beziehen sich auf das Standard Track Race; Sprint, Youth,
    Ruck etc. skalieren wie unten beschrieben.

    ## Race-Varianten

    Die Deadly-Dozen-Familie kennt mehrere Format-Varianten, die alle auf der
    "12 + 12"-Grundidee aufbauen:

    - **Deadly Dozen Track Race** — das Original. 12 × 400 m + 12 Labours
      auf einer Outdoor-Bahn. Solo, Pairs oder Relay (4er-Team).
    - **Deadly Sprint** — Indoor-Variante. 12 × 200 m + 12 Labours mit
      50 % Reps/Distanzen, identische Gewichte. Solo oder Pairs.
    - **Deadly Ruck** — komplettes Track Race mit Gewichtsweste (M 10 kg,
      W 6 kg).
    - **Deadly Mile** — Kurzformat: 400 m Lunges + 400 m Burpee Broad Jumps +
      400 m Bear Crawl + 400 m Run.
    - **Deadly Youth** — Track-Race für 12–15-Jährige; alle 12 Runs + 12
      Labours bei ca. 50 % Volumen und Gewichten. Solo oder Youth & Adult
      Pairs (Begleitperson läuft mit).
    - **Deadly Gross** — 12 Dozens in 12 Stunden, Solo / Pair / Relay (4er,
      mixed: 2 M + 2 W). "Das härteste Hybrid-Event der Welt."
    - **Deadly Swim** — Special Edition: 12 × 100 m Schwimmen + 12 Labours
      (Pool, See oder Meer, Solo).
    - **Deadly Strong** — Gym-Variante: nur die 12 Labours back-to-back,
      ohne Maschinen und ohne Laufen. Solo oder Pairs.
    - **Deadly ERG** — Gym-Variante: 12 × Ergometer-Intervalle (Row / Ski /
      Bike / Air Bike) statt Laufen. Mehrere Sub-Varianten (Row ERG, Ski ERG,
      Bike ERG, Air Bike).
    - **Deadly Barbell** — eigenständige Strength-Wertung: 6 Hantel-Lifts
      (Snatch, Clean & Jerk, Deadlift, Strict Press, Squat, Bench) als
      2-Rep-Max in 60 Minuten. Total Score und Relative Score
      (Total / Körpergewicht).

    ## Hinweis

    Verbindlich sind natürlich immer die offiziellen Race-Formate auf
    [deadlydozen.com/fitness-race-formats](https://deadlydozen.com/fitness-race-formats)
    sowie die offiziellen Regelwerke der einzelnen Varianten.
  long_description_en: |
    ## Format

    **Deadly Dozen** is an outdoor race held on a standard athletics track:
    **12 × 400 m running laps ("Journeys")**, each followed by one of the
    12 stations ("Labours"). Equipment is deliberately accessible — only
    bodyweight, kettlebells, dumbbells and weight plates. No specialised
    machines.

    The sequence is fixed; the next run can only begin once the current
    Labour is complete. The minimum age for the Track Race is 18 (Youth
    format excepted).

    ## The 12 Labours (Track Race, official order)

    Order, equipment, volume and weights from the official race table for
    the Deadly Dozen Track Race.

    | RND | Labour              | Equipment    | Reps / Distance | Male        | Female      |
    |-----|---------------------|--------------|-----------------|-------------|-------------|
    | 1   | Farmers Carry       | Kettlebell   | 240 m           | 2 × 24 kg   | 2 × 16 kg   |
    | 2   | Deadlift            | Kettlebell   | 60 reps         | 1 × 32 kg   | 1 × 24 kg   |
    | 3   | Lunge               | Dumbbell     | 60 m            | 2 × 12.5 kg | 2 × 7.5 kg  |
    | 4   | Snatch              | Dumbbell     | 60 reps         | 1 × 15 kg   | 1 × 9 kg    |
    | 5   | Burpee Broad Jump   | Bodyweight   | 60 m            | —           | —           |
    | 6   | Goblet Squat        | Kettlebell   | 60 reps         | 1 × 16 kg   | 1 × 12 kg   |
    | 7   | Front Carry         | Weight Plate | 240 m           | 1 × 25 kg   | 1 × 20 kg   |
    | 8   | Push Press          | Dumbbell     | 60 reps         | 2 × 12.5 kg | 2 × 6 kg    |
    | 9   | Bear Crawl          | Bodyweight   | 120 m           | —           | —           |
    | 10  | Clean & Press       | Weight Plate | 60 reps         | 1 × 15 kg   | 1 × 10 kg   |
    | 11  | Overhead Carry      | Weight Plate | 180 m           | 1 × 15 kg   | 1 × 10 kg   |
    | 12  | Devil Press         | Dumbbell     | 20 reps         | 2 × 10 kg   | 2 × 5 kg    |

    Each Labour block directly follows a 400 m track lap (Journey). Volumes
    and weights are for the standard Track Race; Sprint, Youth, Ruck etc.
    scale as described below.

    ## Race variants

    The Deadly Dozen family includes several format variants, all built on
    the "12 + 12" core:

    - **Deadly Dozen Track Race** — the original. 12 × 400 m + 12 Labours on
      an outdoor track. Solo, Pairs or Relay (team of four).
    - **Deadly Sprint** — indoor format. 12 × 200 m + 12 Labours at 50 %
      reps/distance with the same weights. Solo or Pairs.
    - **Deadly Ruck** — the full Track Race wearing a weight vest (M 10 kg,
      W 6 kg).
    - **Deadly Mile** — short format: 400 m Lunges + 400 m Burpee Broad Jumps
      + 400 m Bear Crawl + 400 m Run.
    - **Deadly Youth** — Track Race for ages 12–15; all 12 runs + 12 Labours
      at roughly 50 % volume and weight. Solo or Youth & Adult Pairs (parent/
      guardian racing alongside).
    - **Deadly Gross** — 12 Dozens in 12 hours, Solo / Pair / Relay (team of
      four, mixed: 2 M + 2 W). "The hardest hybrid event in the world."
    - **Deadly Swim** — special edition: 12 × 100 m swim + 12 Labours
      (pool, open water or sea swim, Solo only).
    - **Deadly Strong** — gym format: 12 Labours back-to-back, no runs and
      no machines. Solo or Pairs.
    - **Deadly ERG** — gym format: 12 × ergometer intervals (Row / Ski /
      Bike / Air Bike) replacing the runs. Multiple sub-variants
      (Row ERG, Ski ERG, Bike ERG, Air Bike).
    - **Deadly Barbell** — separate strength format: six barbell lifts
      (Snatch, Clean & Jerk, Deadlift, Strict Press, Squat, Bench) as a
      2-rep max within 60 minutes. Total Score and Relative Score
      (Total / bodyweight).

    ## Note

    The official race formats at
    [deadlydozen.com/fitness-race-formats](https://deadlydozen.com/fitness-race-formats)
    and the rulebooks of each individual variant are always authoritative.

athx:
  name: ATHX
  type: Functional Hybrid Competition
  website: https://athxgames.com
  color: "#F25C00"  # ATHX brand orange
  description_de: >
    Kontinuierlicher 2,5-Stunden-Hybrid-Wettkampf über sechs Zonen: Warm-Up,
    Strength, Refuel, Endurance, Recovery, MetCon X. Drei gewertete Workouts
    (Kraft, Ausdauer, MetCon) mit eingebauten Refuel- und Recovery-Stationen.
  description_en: >
    Continuous 2.5-hour hybrid competition across six zones: Warm-Up,
    Strength, Refuel, Endurance, Recovery, MetCon X. Three scored workouts
    (strength, endurance, MetCon) with built-in refuel and recovery stops.
  long_description_de: |
    ## Format

    **ATHX** ist ein 2,5-stündiger kontinuierlicher Fitness-Wettkampf, bei dem
    die Athlet:innen sechs aufeinander folgende **Zonen** durchlaufen.
    Drei davon sind gewertete Workouts (Strength, Endurance, MetCon X), die
    anderen drei sind Service-Zonen (Warm-Up, Refuel, Recovery). Antritt ist
    entweder **Individual** (Solo) oder als **Team** (2er-Pair, gleich-
    geschlechtlich oder Mixed).

    Die Workouts wechseln **jede Saison** und werden global einheitlich
    gefahren, sodass Ergebnisse zwischen Events vergleichbar sind.

    ## Die sechs Zonen

    | # | Zone           | Dauer   | Funktion                                                    |
    |---|----------------|---------|-------------------------------------------------------------|
    | 1 | Warm-Up Zone   | 30 min  | Mobilität, Aktivierung, Vorbereitung                        |
    | 2 | Strength Zone  | 20 min  | Gewerteter Kraft-Workout (z. B. 1RM/3RM/5RM)                |
    | 3 | Refuel Zone    | 10 min  | Erholung, Hydration, Recharge                               |
    | 4 | Endurance Zone | 30 min  | Gewerteter Ausdauer-Workout (Run + Row)                     |
    | 5 | Recovery Zone  | 30 min  | Aktive Recovery mit Recovery-Tech                           |
    | 6 | MetCon X Zone  | 25 min  | Gewerteter Functional/MetCon-Workout (Comp-Floor-Finale)    |

    ## Workouts 2026

    Beispielhaft die offiziellen 2026-Workouts (Strength und Endurance sind
    bei Individual und Teams identisch im Schema; MetCon X ist als Team
    doppelt so groß im Volumen).

    ### Strength (20 min)

    - 0–6 min: **1RM Strict Press**
    - 6–12 min: **3RM Back Squat**
    - 12–20 min: **5RM Deadlift**
    - Score: aufaddiertes Gesamtgewicht

    ### Endurance (22 min Time Cap)

    - Workout: **Run + Row**, jeweils im Wechsel
    - Lauf-Loop: 250 m. Distanzen nach Kategorie:
      **LITE 500 m (2 Runden) / ATHX 750 m (3 Runden) / PRO 1 000 m (4 Runden)**
    - Teams: Athlet A startet auf Run mit Staffelstab, B auf Row; Wechsel
      nach jedem abgeschlossenen Intervall
    - Score: zurückgelegte Gesamtdistanz

    ### MetCon X (25 min Time Cap, Individual ATHX)

    | Block                                  | Gewicht (M / F)         |
    |----------------------------------------|-------------------------|
    | Ski-Erg                                | 45 cal / 30 cal         |
    | 30 Single Arm Alt. Ground-to-Overhead  | 20 kg / 12,5 kg         |
    | 30 m Sandbag Carry                     | 50 kg / 30 kg           |
    | 30 Box Jump Overs                      | 24" / 20"               |
    | 30 m Dual DB Walking Lunges            | 2 × 20 kg / 2 × 12,5 kg |
    | 30 m Burpee Broad Jumps                | —                       |
    | Ski-Erg                                | 45 cal / 30 cal         |

    **LITE-Variante:** Single-Arm GTOH (Arme nicht alternierend, halbe Reps),
    Sandbag 40/20 kg, Box Step-Over erlaubt, Walking Lunges nur Bodyweight,
    leichtere Gewichte.

    **PRO-Variante:** Dual GTOH 22,5/15 kg, Sandbag 70/40 kg, Box 30"/24",
    Lunges Front-Rack 22,5/15 kg.

    **Teams MetCon X:** alle Reps/Distanzen verdoppelt (60 statt 30); Sandbag
    Carry wird auf zwei 30-m-Abschnitte aufgeteilt.

    *Diese Workouts gelten für die Saison 2026 und ändern sich jährlich.
    Verbindliche Bewegungsstandards:
    [athxgames.com/movement-standards/2026](https://athxgames.com/movement-standards/2026).*

    ## Kategorien

    Drei Schwierigkeits-Stufen, jeweils für Individual und Teams:

    - **LITE** — Einstieg, reduzierte Volumen/Gewichte
    - **ATHX** — Standard
    - **PRO** — Wettkampf-Stufe, deutlich erhöhte Lasten

    Teams treten als Pair an: **Männer / Frauen / Mixed**. Mixed-Teams
    verwenden Female-Box-Höhe und Female-DBs für die entsprechenden
    Stationen; Sandbag Carry und Dumbbell GTOH bleiben bei den
    vorgeschriebenen M/F-Gewichten je nach Athlet:in.

    ## Hinweis

    Verbindlich sind immer die offiziellen Bewegungsstandards auf
    [athxgames.com/movement-standards/2026](https://athxgames.com/movement-standards/2026)
    und die aktuellen Workouts auf [athxgames.com](https://athxgames.com) —
    Volumen und Gewichte werden pro Saison neu definiert.
  long_description_en: |
    ## Format

    **ATHX** is a 2.5-hour continuous fitness competition in which athletes
    move through six consecutive **zones**. Three of them are scored
    workouts (Strength, Endurance, MetCon X), the other three are service
    zones (Warm-Up, Refuel, Recovery). You can enter as an **Individual**
    (solo) or as a **Team** (pair, same-sex or Mixed).

    The workouts change **every season** and are run identically worldwide,
    so results stay comparable across events.

    ## The six zones

    | # | Zone           | Duration | Function                                              |
    |---|----------------|----------|-------------------------------------------------------|
    | 1 | Warm-Up Zone   | 30 min   | Mobilise, activate, prepare                           |
    | 2 | Strength Zone  | 20 min   | Scored strength workout (e.g. 1RM/3RM/5RM)            |
    | 3 | Refuel Zone    | 10 min   | Recover, hydrate, recharge                            |
    | 4 | Endurance Zone | 30 min   | Scored endurance workout (Run + Row)                  |
    | 5 | Recovery Zone  | 30 min   | Active recovery with recovery tech                    |
    | 6 | MetCon X Zone  | 25 min   | Scored functional / MetCon workout (comp-floor final) |

    ## 2026 Workouts

    The official 2026 workouts (Strength and Endurance share their scheme
    between Individual and Teams; MetCon X is doubled in volume for Teams).

    ### Strength (20 min)

    - 0–6 min: **1RM Strict Press**
    - 6–12 min: **3RM Back Squat**
    - 12–20 min: **5RM Deadlift**
    - Score: total weight lifted

    ### Endurance (22 min time cap)

    - Workout: **Run + Row**, alternating
    - Run loop: 250 m. Distances by category:
      **LITE 500 m (2 laps) / ATHX 750 m (3 laps) / PRO 1,000 m (4 laps)**
    - Teams: athlete A starts on Run carrying a baton, B on Row; swap after
      each completed interval
    - Score: total distance covered

    ### MetCon X (25 min time cap, Individual ATHX)

    | Block                                  | Weight (M / F)          |
    |----------------------------------------|-------------------------|
    | Ski-Erg                                | 45 cal / 30 cal         |
    | 30 Single Arm Alt. Ground-to-Overhead  | 20 kg / 12.5 kg         |
    | 30 m Sandbag Carry                     | 50 kg / 30 kg           |
    | 30 Box Jump Overs                      | 24" / 20"               |
    | 30 m Dual DB Walking Lunges            | 2 × 20 kg / 2 × 12.5 kg |
    | 30 m Burpee Broad Jumps                | —                       |
    | Ski-Erg                                | 45 cal / 30 cal         |

    **LITE variant:** Single-arm GTOH (no alternating, half the reps),
    Sandbag 40/20 kg, Box step-overs allowed, bodyweight walking lunges,
    lighter weights overall.

    **PRO variant:** Dual GTOH 22.5/15 kg, Sandbag 70/40 kg, Box 30"/24",
    Lunges Front-Rack 22.5/15 kg.

    **Teams MetCon X:** all reps/distances doubled (60 instead of 30);
    the Sandbag Carry is split across two 30 m segments.

    *These workouts apply to the 2026 season and change every year.
    Binding movement standards:
    [athxgames.com/movement-standards/2026](https://athxgames.com/movement-standards/2026).*

    ## Categories

    Three difficulty tiers, each available for Individuals and Teams:

    - **LITE** — entry level, reduced volume/weights
    - **ATHX** — standard
    - **PRO** — competitive tier, significantly heavier loads

    Teams compete as a pair: **Men / Women / Mixed**. Mixed teams use
    female box height and female DBs on the relevant stations; Sandbag
    Carry and Dumbbell GTOH stick to the prescribed M / F weights per
    athlete.

    ## Note

    The official movement standards at
    [athxgames.com/movement-standards/2026](https://athxgames.com/movement-standards/2026)
    and the current workouts on [athxgames.com](https://athxgames.com) are
    always authoritative — volumes and weights are redefined every season.

deka:
  name: DEKA
  type: Functional Fitness
  website: https://spartan.com/deka
  color: "#15803d"  # forest green
  description_de: >
    Stationen-basiertes Hybrid-Race: zehn standardisierte "DEKA Zones"
    (Box Jump Overs, Ram Lunges, Med Ball Throws, Farmers Carry, Row,
    Sled Push, Burpees, Tank Push & Pull, Dead Ball Wall Over, Bike Erg),
    je nach Variante mit unterschiedlich viel Laufanteil davor.
  description_en: >
    Station-based hybrid race: ten standardised "DEKA Zones" (Box Jump
    Overs, Ram Lunges, Med Ball Throws, Farmers Carry, Row, Sled Push,
    Burpees, Tank Push & Pull, Dead Ball Wall Over, Bike Erg), with
    varying amounts of running before each zone depending on the variant.
  long_description_de: |
    ## Format

    **DEKA** (von griech. *déka* = "zehn") ist ein **stationen-basiertes
    Hybrid-Race** unter dem Dach von Spartan. Der Kern ist immer derselbe:
    **10 funktionelle "DEKA Zones"** in fester Reihenfolge. Was die einzelnen
    Subformate unterscheidet, ist die Lauf-Distanz, die jeder Zone vorgelagert
    ist — von "gar nichts" (STRONG) bis "5 km" (FIT) bzw. "10 km" (FIT Ultra).

    DEKA wurde 2019 von Joe De Sena als zugänglichere Alternative zu den
    Spartan-OCR-Rennen lanciert: keine Schlamm-Hindernisse, kein
    Outdoor-Gelände, sondern Indoor-Bahn oder Halle mit standardisiertem
    Equipment, das jeder kennt.

    ## Die 10 DEKA Zones

    Die Reihenfolge ist global einheitlich; die exakten Gewichte werden pro
    Saison im Rulebook bestätigt — die Angaben unten sind typische Werte.

    | # | Zone                          | Volumen / Reps | Charakter            | Typ. Gewicht (M / W) |
    |---|-------------------------------|----------------|----------------------|----------------------|
    | 1 | Alternating Box Jump Overs    | 20 Reps        | Kraft + Power        | Box 20" / 16"        |
    | 2 | Ram Alt. Reverse Lunges       | 20 Reps        | Kraft (Beine)        | Ram ~22 / 13 kg      |
    | 3 | Med Ball Sit-Up Throws        | 20 Reps        | Power (Core)         | ~9 / 6 kg            |
    | 4 | Farmers Carry                 | 100 m          | Kraft-Conditioning   | 2 × ~22 / 13 kg KB   |
    | 5 | **Row Erg**                   | 500 m          | **reine Ausdauer**   | —                    |
    | 6 | Sled Push                     | 25 m           | Kraft + Cardio       | ~50 / 30 kg          |
    | 7 | Burpee Over Box / Target      | 20 Reps        | Kraft-Conditioning   | —                    |
    | 8 | Tank Push & Pull              | 50 m           | Kraft + Cardio       | Tank-Sled            |
    | 9 | Dead Ball Wall Over           | 20 Reps        | Power (Schulter)     | ~22 / 13 kg          |
    | 10| **Bike Erg / Air Bike**       | 20 cal         | **reine Ausdauer**   | —                    |

    Etwa 30–40 % der Workout-Zeit sind klassischer Cardio-Stimulus
    (Row, Bike, Carries, Sled-Bewegungen) — auch in den Varianten ohne Lauf.

    ## Subformate im Vergleich

    | Subformat | Lauf-Anteil | Stationen | Charakter | Dauer (Elite → Open) |
    |-----------|-------------|-----------|-----------|----------------------|
    | **DEKA FIT** | **5 km** (10 × 500 m vor jeder Zone) | alle 10 | klassisch hybrid | ~30 → ~50 min |
    | **DEKA FIT Ultra** | **~10 km** (10 × 1 km bzw. 2× FIT-Volumen) | alle 10 | längste Hybrid-Variante | 60–90 min |
    | **DEKA MILE** | **1 Meile** (10 × ~160 m) | alle 10 | hybrid, kürzer; Einsteiger / Familie | ~25–40 min |
    | **DEKA STRONG** | **0 m** | alle 10 back-to-back | Strength-Endurance ohne Laufen | ~15–25 min |
    | **DEKA STRONG Affiliate** | 0 m | wie STRONG | identisch, in Affiliate-Gyms | wie STRONG |
    | **DEKA ATLAS Affiliate** | 0 m | Atlas-Steine | reines Strength-Format, kein Standard-Zonen-Set | — |
    | **DEKA IGNITE** | unklar | reduziert | offizielle Einsteiger-/Demo-Variante (wenig dokumentiert) | — |

    *FIT, FIT Ultra und MILE sind klassisch hybrid (Ausdauer-Lauf + Kraft).
    STRONG ist Strength-Endurance: kein Lauf, aber Row + Bike + Carries
    erzeugen weiterhin nennenswerten Cardio-Stimulus. ATLAS ist ein
    eigenständiges Strength-only-Format.*

    ## Kategorien

    Pro Subformat gibt es typischerweise:

    - **Singles** — Männer / Frauen (verschiedene Altersklassen)
    - **Pairs / Doubles** — Männer / Frauen / Mixed; die Athlet:innen teilen
      Stationen und/oder Läufe untereinander auf
    - **Elite** — schmale Spitzen-Wertung für Qualifikation zur DEKA World
      Championship
    - **Youth** — bei einzelnen Events (z. B. DEKA MILE Youth)

    ## Veranstalter & Geschichte

    DEKA wird global von **Spartan Race** organisiert (Gründer Joe De Sena).
    Während Spartan-OCR-Rennen Outdoor und Hindernisse sind, ist DEKA das
    Indoor-/Standard-Equipment-Format der Marke. Jährlich gibt es eine
    **DEKA World Championship** mit Qualifikation über die Saison-Events.
    Daneben das **DEKA Roadshow**-Konzept: Einzel-Events in Affiliate-Gyms
    weltweit, um die Reichweite über die großen Convention-Center-Venues
    hinaus auszubauen.

    ## Hinweis

    Verbindlich sind immer die offiziellen Race-Standards und Gewichte auf
    [spartan.com/deka](https://spartan.com/deka) bzw. dem aktuellen DEKA-Rulebook.
  long_description_en: |
    ## Format

    **DEKA** (Greek *déka* = "ten") is a **station-based hybrid race**
    under the Spartan umbrella. The core is always the same: **10
    functional "DEKA Zones"** in a fixed order. What differs between the
    subformats is the running distance in front of each zone — from "none"
    (STRONG) to 5 km (FIT) or 10 km (FIT Ultra).

    DEKA was launched in 2019 by Joe De Sena as a more accessible
    alternative to Spartan's OCR races: no mud, no outdoor obstacles —
    instead an indoor track or hall with standardised, familiar equipment.

    ## The 10 DEKA Zones

    The order is the same globally; exact weights are confirmed each season
    in the rulebook. Values below are typical.

    | # | Zone                          | Volume / Reps | Character             | Typ. Weight (M / W) |
    |---|-------------------------------|---------------|-----------------------|---------------------|
    | 1 | Alternating Box Jump Overs    | 20 reps       | Strength + Power      | Box 20" / 16"       |
    | 2 | Ram Alt. Reverse Lunges       | 20 reps       | Strength (legs)       | Ram ~22 / 13 kg     |
    | 3 | Med Ball Sit-Up Throws        | 20 reps       | Power (core)          | ~9 / 6 kg           |
    | 4 | Farmers Carry                 | 100 m         | Strength-conditioning | 2 × ~22 / 13 kg KB  |
    | 5 | **Row Erg**                   | 500 m         | **pure endurance**    | —                   |
    | 6 | Sled Push                     | 25 m          | Strength + cardio     | ~50 / 30 kg         |
    | 7 | Burpee Over Box / Target      | 20 reps       | Strength-conditioning | —                   |
    | 8 | Tank Push & Pull              | 50 m          | Strength + cardio     | Tank sled           |
    | 9 | Dead Ball Wall Over           | 20 reps       | Power (shoulder)      | ~22 / 13 kg         |
    | 10| **Bike Erg / Air Bike**       | 20 cal        | **pure endurance**    | —                   |

    Roughly 30–40 % of the workout time is classic cardio stimulus
    (Row, Bike, Carries, sled work) — even in the variants without running.

    ## Subformats compared

    | Subformat | Running | Stations | Character | Duration (Elite → Open) |
    |-----------|---------|----------|-----------|-------------------------|
    | **DEKA FIT** | **5 km** (10 × 500 m before each zone) | all 10 | classic hybrid | ~30 → ~50 min |
    | **DEKA FIT Ultra** | **~10 km** (10 × 1 km, double the FIT volume) | all 10 | longest hybrid variant | 60–90 min |
    | **DEKA MILE** | **1 mile** (10 × ~160 m) | all 10 | hybrid, shorter; entry-level / family | ~25–40 min |
    | **DEKA STRONG** | **0 m** | all 10 back-to-back | strength-endurance without running | ~15–25 min |
    | **DEKA STRONG Affiliate** | 0 m | as STRONG | same, hosted at affiliate gyms | as STRONG |
    | **DEKA ATLAS Affiliate** | 0 m | atlas stones | standalone strength-only format | — |
    | **DEKA IGNITE** | unclear | reduced | official entry/demo variant (lightly documented) | — |

    *FIT, FIT Ultra and MILE are classic hybrid (endurance run + strength).
    STRONG is strength-endurance: no running, but Row + Bike + Carries
    still deliver substantial cardio stimulus. ATLAS is a standalone
    strength-only format.*

    ## Categories

    Each subformat typically offers:

    - **Singles** — Men / Women (multiple age groups)
    - **Pairs / Doubles** — Men / Women / Mixed; athletes split stations
      and/or runs between them
    - **Elite** — narrow top-tier ranking for DEKA World Championship
      qualification
    - **Youth** — at selected events (e.g. DEKA MILE Youth)

    ## Organisation & history

    DEKA is run globally by **Spartan Race** (founder Joe De Sena).
    Whereas Spartan OCR races are outdoor and obstacle-driven, DEKA is the
    brand's indoor / standard-equipment format. There is an annual
    **DEKA World Championship** with qualification over the season events.
    The **DEKA Roadshow** programme brings single events to affiliate gyms
    worldwide, extending reach beyond the large convention-centre venues.

    ## Note

    The official race standards and weights at
    [spartan.com/deka](https://spartan.com/deka) and the current DEKA
    rulebook are always authoritative.

