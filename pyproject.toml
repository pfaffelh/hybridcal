[project]
name = "hybridcal"
version = "0.1.0"
description = "Community-driven calendar for hybrid sport events"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "ics>=0.7.2",
    "feedgen>=1.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
geocode = ["geopy>=2.4"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hybridcal"]
